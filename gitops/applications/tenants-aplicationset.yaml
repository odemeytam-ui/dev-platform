apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-sample-apps
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "sample-app-payments-dev"
    spec:
      project: default
      source:
        repoURL: https://github.com/odemeytam-ui/dev-platform.git
        targetRevision: main
        path: helm/charts
        helm:
          valueFiles:
            - values.yaml
          parameters:
            - name: app.env.APP_ENV
              value: "payments-dev"
            - name: app.ingress.host
              value: "payments-dev.localhost"
            - name: postgres.enabled
              value: "false"
      destination:
        server: https://default.svc
        namespace: tenant-payments-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false