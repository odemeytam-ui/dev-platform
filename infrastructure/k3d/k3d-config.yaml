apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev-platform-cluster
servers: 1
agents: 2
ports:
  # Forward host port 8080 to the cluster loadbalancer port 80 (HTTP)
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  # Forward host port 8443 to the cluster loadbalancer port 443 (HTTPS)
  - port: 8443:443
    nodeFilters:
      - loadbalancer
  # Forward a NodePort range (e.g., 30000-30010) directly to the server node
  - port: 30000-30010:30000-30010
    nodeFilters:
      - server: 0
options:
  k3d:
    wait: true
    timeout: "60s"
  k3s:
    extraArgs:
      - arg: "--tls-san=127.0.0.1"
        nodeFilters:
          - server: *
      - args: "--node-taint=node-role.kubernetes.io/control-plane:NoSchedule"
        nodeFilters:
          - server: *
  kubeconfig:
    updateDefaultKubeconfig: true # Merges cluster details into ~/.kube/config
    switchCurrentContext: true    # Sets k3d-dev-platform-cluster as active