app:
  name: fastapi-app
  replicaCount: 2
  image:
    repository: fastapi-k3d-demo
    tag: "v1"
    pullPolicy: IfNotPresent
  env:
    APP_ENV: "default"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: true
    path: /
    pathType: Prefix
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5

postgres:
  enabled: true
  image: postgres:16-alpine
  database: appdb
  username: appuser
  password: "" # Must be injected at deploy time via --set postgres.password=$DB_PASSWORD
  storage:
    size: 1Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"